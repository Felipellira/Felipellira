</style>

<text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#E6EDF3" letter-spacing="-.4">Felipe Lira</text>

<g class="lens" transform="translate(196 42)">
  <circle cx="0" cy="0" r="12" fill="#34FEC2" opacity=".18" filter="url(#b)"/>
  <circle cx="17" cy="0" r="12" fill="#34FEC2" opacity=".18" filter="url(#b)"/>
  <circle cx="0" cy="0" r="5.5" fill="url(#g)"/>
  <circle cx="17" cy="0" r="5.5" fill="url(#g)"/>
  <circle cx="0" cy="0" r="5.5" fill="none" stroke="#34FEC2" stroke-opacity=".85" stroke-width="1.1"/>
  <circle cx="17" cy="0" r="5.5" fill="none" stroke="#34FEC2" stroke-opacity=".85" stroke-width="1.1"/>
  <line x1="5.5" y1="0" x2="11.5" y2="0" stroke="#34FEC2" stroke-opacity=".6" stroke-width="1.1"/>
</g>

<text x="0" y="84" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B949E" xml:space="preserve">backend  ·  tooling  ·  cfx.re runtime</text>
<text x="900" y="84" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6E7681" xml:space="preserve">santa catarina, br  ·  utc−3</text>

<rect x="0" y="118" width="900" height="1" fill="#21262D"/>
<rect x="0" y="118" width="0" height="1" fill="#34FEC2" opacity=".9"><animate attributeName="width" from="0" to="120" dur="1.2s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 0 0 1"/></rect>
