<g transform="translate(56 196)">
  <circle cx="4" cy="-4" r="3" fill="#34FEC2"/>
  <circle cx="4" cy="-4" r="3" fill="none" stroke="#34FEC2" stroke-width="1.2">
    <animate attributeName="r" from="3" to="11" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines=".2 0 .3 1"/>
    <animate attributeName="opacity" from=".7" to="0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="18" y="0" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6E7681" letter-spacing=".3">Santa Catarina, Brasil · UTC−3</text>
</g>

<g class="lens" transform="translate(746 112) rotate(-6)">
  
    <circle cx="0" cy="0" r="44" fill="#34FEC2" opacity=".16" filter="url(#blur)"/>
    <circle cx="0" cy="0" r="22" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#34FEC2" stroke-opacity=".75" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="27" fill="none" stroke="#34FEC2" stroke-opacity=".18" stroke-width="1"/>
  
    <circle cx="64" cy="0" r="44" fill="#34FEC2" opacity=".16" filter="url(#blur)"/>
    <circle cx="64" cy="0" r="22" fill="url(#glow)"/>
    <circle cx="64" cy="0" r="22" fill="none" stroke="#34FEC2" stroke-opacity=".75" stroke-width="1.5"/>
    <circle cx="64" cy="0" r="27" fill="none" stroke="#34FEC2" stroke-opacity=".18" stroke-width="1"/>
  <line x1="23.5" y1="0" x2="40.5" y2="0" stroke="#34FEC2" stroke-opacity=".55" stroke-width="1.5"/>
</g>
</svg>
