<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Felipe Lira — backend, developer tooling, game modding. Santa Catarina, Brasil.">
<rect x=".5" y=".5" width="899" height="239" rx="14" fill="#0D1117" stroke="#21262D"/>

<defs>
  <clipPath id="r"><rect width="900" height="240" rx="14"/></clipPath>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#34FEC2"/></pattern>
  <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
  <mask id="dotmask"><rect width="900" height="240" fill="url(#fade)"/></mask>
  <radialGradient id="glow"><stop offset="0" stop-color="#34FEC2" stop-opacity=".95"/><stop offset=".5" stop-color="#34FEC2" stop-opacity=".3"/><stop offset="1" stop-color="#34FEC2" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#34FEC2" stop-opacity=".14"/><stop offset="1" stop-color="#34FEC2" stop-opacity="0"/></radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style>
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
  @keyframes breathe { 0%,100% { opacity:.72 } 50% { opacity:1 } }
  .caret { animation: blink 1.1s step-end infinite }
  .lens  { animation: breathe 4.8s ease-in-out infinite }
</style>
<g clip-path="url(#r)">
  <rect width="900" height="240" fill="url(#dots)" mask="url(#dotmask)" opacity=".12"/>
  <ellipse cx="770" cy="118" rx="240" ry="160" fill="url(#halo)"/>
</g>

<text x="56" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#E6EDF3" letter-spacing="-.8">Felipe Lira</text>
<rect x="56" y="114" width="0" height="2" fill="#34FEC2"><animate attributeName="width" from="0" to="40" dur=".7s" begin=".45s" fill="freeze" calcMode="spline" keySplines=".2 0 0 1"/></rect>

